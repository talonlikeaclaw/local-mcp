services:
  context7:
    build:
      context: .
    environment:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:?Set CONTEXT7_API_KEY in .env}
    stdin_open: true
    tty: false

  time:
    image: docker/mcp-gateway:v0.40.4@sha256:ef76294cd792da424bbcae51122b8a3ca5793c2c112eef3c25889bebbed614a6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mcp-network
    stdin_open: true
    tty: false
    command: --servers=time --transport=stdio

  dockerhub:
    image: docker/mcp-gateway:v0.40.4@sha256:ef76294cd792da424bbcae51122b8a3ca5793c2c112eef3c25889bebbed614a6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/run/secrets/mcp.env:ro
    networks:
      - mcp-network
    stdin_open: true
    tty: false
    command: --servers=dockerhub --transport=stdio --secrets=/run/secrets/mcp.env

  weather:
    image: ghcr.io/cmer81/open-meteo-mcp@sha256:794398f48749e81c3bee36d7ea92348b66cca5c1317b26f9bbb4dca335fa6a59
    platform: linux/amd64
    environment:
      TRANSPORT: stdio
    networks:
      - mcp-network
    stdin_open: true
    tty: false
    healthcheck:
      disable: true

  next-devtools:
    build:
      context: .
      dockerfile: Dockerfile.next-devtools
    network_mode: host
    stdin_open: true
    tty: false

  anytype:
    image: node:24-alpine@sha256:83f1c388c31fb2e51f7cbd4dea949b96260798c98f206e8e4696bc93bd964e3a
    command: npx -y @anyproto/anytype-mcp@2.0.1
    environment:
      ANYTYPE_API_BASE_URL: ${ANYTYPE_API_BASE_URL:-http://192.168.0.215:31012}
      OPENAPI_MCP_HEADERS: '{"Authorization":"Bearer ${ANYTYPE_API_KEY:?Set ANYTYPE_API_KEY in .env}","Anytype-Version":"2025-11-08"}'
    networks:
      - mcp-network
    stdin_open: true
    tty: false

networks:
  mcp-network:
